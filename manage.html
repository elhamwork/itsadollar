<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage your membership — It's a Dollar</title>
<meta name="description" content="Update your payment method or cancel your $1/month membership.">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 font-family=%22system-ui%22 font-weight=%22700%22>$</text></svg>">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body class="no-js">
<a class="skip-link" href="#main">Skip to content</a>

<header class="checkout-header">
  <div class="shell header__inner">
    <a class="brand" href="index.html">It's a Dollar</a>
    <a class="link" href="index.html">Back to home</a>
  </div>
</header>

<main id="main" class="checkout">
  <div class="checkout__inner">
    <section class="step-panel">
      <h1 class="step-panel__title" tabindex="-1">Manage your membership.</h1>
      <p class="step-panel__note">Enter the email you joined with to update your payment method or cancel.</p>

      <div class="form">
        <div class="field-group">
          <div class="input-wrap">
            <input class="input" type="email" id="manage-email" placeholder=" " autocomplete="email" required>
            <label class="input-label" for="manage-email">Email</label>
            <span class="error" id="manage-error" role="alert"></span>
          </div>
        </div>
        <div class="form__actions">
          <button type="button" class="btn btn--lg btn--block" id="manage-submit">Continue</button>
        </div>
        <p class="fine" id="manage-result"></p>
        <p class="fine">We&rsquo;ll email you a secure link to Stripe&rsquo;s billing page, where you can update your card or cancel anytime.</p>
      </div>
    </section>
  </div>
</main>

<script src="assets/js/site.js" defer></script>
<script src="assets/js/manage.js" defer></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
