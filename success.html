<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're in — It's a Dollar</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22 font-family=%22system-ui%22 font-weight=%22700%22>$</text></svg>">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body class="no-js">
<a class="skip-link" href="#main">Skip to content</a>

<header class="checkout-header">
  <div class="shell header__inner">
    <a class="brand" href="index.html">It's a Dollar</a>
  </div>
</header>

<main id="main" class="checkout">
  <div class="checkout__inner">
    <section class="step-panel confirm" data-confirm-panel>
      <svg class="confirm__mark" viewBox="0 0 60 60" fill="none" aria-hidden="true">
        <circle cx="30" cy="30" r="26" stroke="currentColor" stroke-width="2.5"/>
        <path d="M19 31l7 7 15-16" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h1 class="confirm__title" tabindex="-1">You&rsquo;re in.</h1>
      <p class="confirm__note">Thank you for joining the $1/month movement, <span data-confirm-name>friend</span>.</p>
      <div class="confirm__actions">
        <a class="btn btn--lg" href="index.html">Back to home</a>
      </div>

      <div class="confirm__share" data-share-block hidden>
        <p class="fine">Share your link — earn 10 points when someone joins through it, and spend them to boost your vote.</p>
        <div class="share-row">
          <input class="input" type="text" id="referral-link" readonly aria-label="Your referral link">
          <button type="button" class="btn btn--quiet" id="copy-link-btn">Copy</button>
        </div>
      </div>
    </section>
  </div>
</main>

<script src="assets/js/site.js" defer></script>
<script src="assets/js/success.js" defer></script>
<script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
